[package]
name = "zcraft"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
tempfile = "3"
base64 = "0.22"
png = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
